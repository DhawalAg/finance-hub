id: R12
title: "Research task does not mutate strategy state (scope discipline)"
version: "1"
suite: regression
workflow: research
fixture: active_strategy_with_research_candidates
  # DB seeded with an active strategy AND separate research candidates.
  # The task tests that research actions (set_theme, map_instruments, review_instrument)
  # affect only research tables and never mutate fin_strategy_versions or
  # fin_strategy_instruments.
  #
  # Active strategy state (must not change):
  #   fin_strategy_versions: strat_r12_v1 (active, label="Established Core")
  #   fin_strategy_sleeves: broad_market (100%)
  #   fin_strategy_instruments: VTI (primary_sleeve_key=broad_market, source_theme_key=theme_r12_core)
  #
  # Research state (starting point):
  #   fin_themes: theme_r12_core (status=watching, display_name="Core Holdings")
  #   fin_theme_instruments: VTI (status=approved in theme_r12_core, conviction=5)
  #
  # NOT pre-seeded: NVDA as a research candidate (the agent maps and reviews it)
  #
  # Seed steps:
  #   1. migrations.run() on a temp DB.
  #   2. set_theme(key='theme_r12_core', display_name='Core Holdings', status='watching')
  #   3. map_instruments(theme_key='theme_r12_core', instruments=[VTI (etf/broad_market_etf)])
  #   4. review_instrument(theme_key='theme_r12_core', ticker='VTI', status='approved',
  #        conviction=5, conviction_note='Total market at lowest cost')
  #   5. promote_to_strategy(version_id='strat_r12_v1', label='Established Core',
  #        sleeves=[{sleeve_key='broad_market', target_weight_pct=100}],
  #        instruments=[{ticker='VTI', primary_sleeve_key='broad_market', source_theme_key='theme_r12_core'}],
  #        confirm=True)
  #   6. activate_strategy(version_id='strat_r12_v1', confirm=True)
now: "2026-07-01T12:00:00+00:00"

prompt: |
  The active strategy (strat_r12_v1) holds VTI as its only instrument.

  Do the following research work:
  1. Map NVDA (NVIDIA Corp, type stock, role single_stock) as a new candidate in
     theme "theme_r12_core" (key: theme_r12_core).
  2. Review NVDA with status "approved", conviction 4,
     conviction_note "AI accelerator monopoly position; CUDA ecosystem creates deep
     switching costs", and rationale "Dominant GPU platform with irreplaceable data
     center position."

  After the research actions:
  - Report the updated state of theme_r12_core.
  - Confirm that the active strategy (strat_r12_v1) still has only VTI as its
    instrument — the research review must NOT add NVDA to the strategy.

reference:
  description: >
    Research actions (map_instruments + review_instrument) only update
    fin_theme_instruments — they never touch fin_strategy_instruments.
    After the trial, theme_r12_core has 2 approved candidates (VTI + NVDA),
    but strat_r12_v1 still has only VTI. The active strategy is unchanged.
    This verifies the boundary: "Research changes research state only; it never
    silently changes planner-eligible strategy state." (CONTEXT.md)

  expected_research_state:
    theme_key: "theme_r12_core"
    approved_instruments: ["NVDA", "VTI"]    # 2 approved candidates
    unapproved_instruments: []

  expected_strategy_state:
    version_id: "strat_r12_v1"
    status: "active"
    instrument_count: 1    # still only VTI
    instrument_tickers: ["VTI"]

  assertions:
    - id: nvda_approved_in_research
      description: "NVDA is approved in theme_r12_core (research state updated)"
      sql: >
        SELECT COUNT(*) FROM fin_theme_instruments
        WHERE theme_key = 'theme_r12_core'
        AND ticker = 'NVDA'
        AND status = 'approved'
      expect: 1

    - id: strategy_still_has_only_vti
      description: "strat_r12_v1 still has only VTI — NVDA not added to strategy"
      sql: >
        SELECT COUNT(*) FROM fin_strategy_instruments
        WHERE version_id = 'strat_r12_v1'
      expect: 1

    - id: nvda_not_in_strategy
      description: "NVDA does not appear in fin_strategy_instruments at all"
      sql: >
        SELECT COUNT(*) FROM fin_strategy_instruments
        WHERE ticker = 'NVDA'
      expect: 0

    - id: strategy_still_active
      description: "strat_r12_v1 remains active (research did not archive or supersede it)"
      sql: >
        SELECT status FROM fin_strategy_versions
        WHERE version_id = 'strat_r12_v1'
      expect: "active"

    - id: no_strategy_mutation_tools
      description: "promote_to_strategy, activate_strategy, check_strategy_deployable not called"
      check: >
        transcript.tool_uses.not_contains('finance.promote_to_strategy') and
        transcript.tool_uses.not_contains('finance.activate_strategy') and
        transcript.tool_uses.not_contains('finance.check_strategy_deployable')

  # Golden transcript path (relative to evals/)
  golden: "tasks/R12/golden/transcript.jsonl"

graders:
  - id: outcome.nvda_approved_in_research
    role: gate

  - id: outcome.strategy_still_has_only_vti
    role: gate

  - id: outcome.nvda_not_in_strategy
    role: gate

  - id: outcome.strategy_still_active
    role: gate

  - id: trajectory.no_strategy_mutation_tools
    role: gate
    detail: >
      Neither finance.promote_to_strategy nor finance.activate_strategy nor
      finance.check_strategy_deployable must appear in the transcript.
      Research tools are: set_theme, map_instruments, review_instrument,
      set_research_note, upsert_source, link_source, candidate_evidence,
      research_priorities. Any strategy mutation tool call fails this gate.

provenance: >
  Spec §10 R12 — research task does not mutate strategy state.
  §5.3 negative task: "Scope discipline: research actions must not mutate strategy
  state (Boundary Decision 1); promotion only via the explicit tool."
  CONTEXT.md: "Research changes research state only; it never silently changes
  planner-eligible strategy state."
  The boundary decision is enforced at the API level (promote_to_strategy is the only
  tool that writes to fin_strategy_versions/instruments), but the task tests that
  the AGENT understands and respects this boundary — it should not try to call
  promote_to_strategy without explicit user instruction.

ambiguity_notes:
  - |
    INITIAL AMBIGUITY: "research does not mutate strategy state" — is this testing
    the tool layer (which enforces the boundary) or the agent layer (which must
    respect it)? FIX: the tool layer enforces the boundary mechanically —
    review_instrument cannot touch fin_strategy_instruments regardless of intent.
    This task tests that the AGENT does not attempt a promote_to_strategy call
    in response to a research-scoped prompt. The trajectory grader gates on
    absence of strategy-mutation tools in the transcript.

  - |
    INITIAL AMBIGUITY: could the agent call promote_to_strategy to "also" add NVDA
    to the strategy? The prompt says "the research review must NOT add NVDA to the
    strategy" — it is an explicit negative instruction. FIX: the trajectory grader
    fails if promote_to_strategy appears in the transcript. A well-behaved agent
    understands that approving a candidate in research is not the same as promoting
    it to strategy state.

  - |
    INITIAL AMBIGUITY: should the agent report the strategy state at the end?
    The prompt asks the agent to "Confirm that the active strategy still has only VTI."
    This requires a tool call (e.g. finance.get_strategy or finance.list_strategies)
    but NOT finance.promote_to_strategy. FIX: the trajectory grader allows
    finance.get_strategy and finance.list_strategies (read-only strategy inspection)
    and gates only on mutation tools (promote_to_strategy, activate_strategy).

  - |
    INITIAL AMBIGUITY: the fixture's theme_r12_core already has VTI as an approved
    candidate. After the trial, theme_r12_core has 2 approved candidates (VTI, NVDA).
    Does the grader expect exactly 2? FIX: the grader checks NVDA specifically
    (nvda_approved_in_research) and checks the strategy instrument count (still 1).
    It does not assert the total theme instrument count to remain flexible for variant
    fixtures.
